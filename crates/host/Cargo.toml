[package]
name = "host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Production wiring for running the firmware on a desktop computer, with a local HTTP control API."

[lib]
path = "src/lib.rs"

[[bin]]
name = "doorcode-host"
path = "src/main.rs"

[dependencies]
app.workspace = true
ciborium = "0.2"
connectors.workspace = true
connectors-host.workspace = true
protocol.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
pretty_assertions.workspace = true
testkit.workspace = true
tempfile = "3"
ureq = { version = "3.5", default-features = false }

[lints]
workspace = true
