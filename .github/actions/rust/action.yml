name: Rust toolchain and verification tools
description: >
  Installs the desktop workspace's Rust toolchain and the cargo tools the
  Makefile's verification targets call, each at a stated version.

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: |
        toolchain=1.99.1
        rustup toolchain install "$toolchain" --profile minimal \
          --component clippy,rustfmt,llvm-tools
        rustup default "$toolchain"

    - name: Install cargo tools
      uses: taiki-e/install-action@v2
      with:
        tool: >-
          cargo-llvm-cov@0.9.1,
          cargo-mutants@27.1.0,
          cargo-machete@0.9.2,
          rust-code-analysis-cli@0.0.25

    - name: Install bc
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bc

    - name: Cache cargo builds
      uses: Swatinem/rust-cache@v2
