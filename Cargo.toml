[workspace]
resolver = "2"
members = [
    "crates/connectors",
    "crates/protocol",
    "crates/app",
    "crates/testkit",
    "crates/connectors-host",
    "crates/host",
]
# The firmware is its own workspace: it targets xtensa-esp32-espidf and builds
# inside the Espressif toolchain container. See firmware/README.md.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
connectors = { path = "crates/connectors" }
protocol = { path = "crates/protocol" }
app = { path = "crates/app" }
testkit = { path = "crates/testkit" }
connectors-host = { path = "crates/connectors-host" }
pretty_assertions = "1.4"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "deny"
cognitive_complexity = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
