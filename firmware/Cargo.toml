# Separate workspace: this package targets xtensa-esp32-espidf and builds in
# the Espressif Rust container (make firmware-build). The desktop workspace in
# the repository root excludes this directory.
#
# The Espressif toolchain is nightly; panic-immediate-abort lets the
# `migrate` profile below abort on a panic without formatting a message.
cargo-features = ["panic-immediate-abort"]

[workspace]

[package]
name = "doorcode-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.77"
description = "ESP32 connector implementations and production wiring for the door controller."

[[bin]]
name = "doorcode-firmware"
harness = false

# Built for size: an image must fit the partition table's smaller app slot,
# 0x1F0000 bytes.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# The stepping-stone image for boards on ESP-IDF's standard two-OTA table
# (docs/migration.md), built with `--profile migrate --features migrate`: it
# must fit that table's 1 MB slots, so panics abort without a message.
[profile.migrate]
inherits = "release"
panic = "immediate-abort"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
app = { path = "../crates/app" }
connectors = { path = "../crates/connectors" }
protocol = { path = "../crates/protocol" }
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["critical-section"] }

[features]
# The stepping-stone image: no keypad, strike, door sensor, or Mesh-Lite, and
# the firmware's own log compiled down to errors.
migrate = ["log/release_max_level_error"]

[build-dependencies]
embuild = "0.33"
minicbor = { version = "2.3", features = ["alloc"] }
serde_json = "1"

[lints.clippy]
cognitive_complexity = "deny"

# Mesh-Lite from the ESP component registry, with the IoT bridge it builds
# on: bindings in esp_idf_svc::sys::mesh_lite.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mesh_lite", version = "1.0.2" }
bindings_header = "src/mesh_lite.h"
bindings_module = "mesh_lite"
